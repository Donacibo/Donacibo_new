<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Box container -->
  <rect x="50" y="60" width="120" height="100" rx="5" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Box segments - original colors -->
  <rect x="52" y="62" width="116" height="32" rx="3" fill="#2d5a27"/>
  <rect x="52" y="96" width="116" height="30" rx="3" fill="#e67e22"/>
  <rect x="52" y="128" width="116" height="28" rx="3" fill="#f39c12"/>
  
  <!-- Food items inside box -->
  <!-- Bread loaves -->
  <rect x="60" y="70" width="80" height="12" rx="3" fill="#f4d03f"/>
  <rect x="60" y="85" width="80" height="12" rx="3" fill="#f4d03f"/>
  
  <!-- Red item -->
  <rect x="60" y="100" width="30" height="15" rx="2" fill="#e74c3c"/>
  
  <!-- Hand reaching in -->
  <g transform="translate(10, 80)">
    <!-- Palm -->
    <ellipse cx="25" cy="35" rx="20" ry="15" fill="#e74c3c"/>
    <!-- Fingers -->
    <rect x="15" y="15" width="8" height="25" rx="4" fill="#e74c3c"/>
    <rect x="25" y="12" width="8" height="28" rx="4" fill="#e74c3c"/>
    <rect x="35" y="14" width="8" height="26" rx="4" fill="#e74c3c"/>
    <rect x="45" y="18" width="8" height="22" rx="4" fill="#e74c3c"/>
    <rect x="5" y="20" width="8" height="20" rx="4" fill="#e74c3c"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">Donacibo</text>
</svg>